[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycopykat"
version = "0.2.0"
description = "A Python implementation of CopyKAT (Gao et al., Nat Biotechnol 2021) that reproduces R copykat 1.2.5: copy-number profiles and aneuploid/diploid calls of single cells from scRNA-seq counts."
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Jieshen Xian", email = "lucyagune3@gmail.com" }, { name = "OmicVerse Team", email = "contact@omicos.cn" }]
keywords = [
  "single-cell",
  "scRNA-seq",
  "copy-number",
  "CNA",
  "aneuploidy",
  "tumor",
  "copykat",
  "bioinformatics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "numba>=0.59",
  "threadpoolctl>=3",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "anndata>=0.10",
  "typer>=0.9",
  "pyarrow>=14",
]

[project.urls]
Homepage = "https://github.com/omicverse/py-CopyKAT"
Repository = "https://github.com/omicverse/py-CopyKAT"
Issues = "https://github.com/omicverse/py-CopyKAT/issues"
"Upstream R reference" = "https://github.com/navinlabcode/copykat"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-benchmark>=4",
  "hypothesis>=6",
  "ruff>=0.4",
  "mypy>=1.9",
]

[project.scripts]
pycopykat = "pycopykat.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["pycopykat"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
