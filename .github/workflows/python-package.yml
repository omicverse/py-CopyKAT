name: python-package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync project (dev extras)
        run: uv sync --extra dev

      - name: Smoke + unit tests
        # tests/test_regression.py is marked `slow` (needs R copykat) and
        # is excluded by the default pyproject addopts ("-m 'not slow'").
        # tests/test_r_parity.py skips cleanly when tests/r_out/ is absent
        # (no R installed in CI).
        run: uv run pytest tests/unit tests/test_smoke.py tests/test_r_parity.py -v

  build:
    name: build wheel + twine check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build + twine
        run: pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Assert pure-Python wheel (no binary extensions)
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          whl = wheels[0]
          assert whl.endswith("-py3-none-any.whl"), f"non-universal wheel: {whl}"
          with zipfile.ZipFile(whl) as z:
              bad = [n for n in z.namelist() if n.endswith((".so", ".pyd", ".dylib"))]
          assert not bad, f"binary extensions found in wheel: {bad}"
          print(f"OK pure-Python wheel: {whl}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  lint:
    # Informational only — ruff has ~190 pre-existing findings; this job
    # surfaces them without blocking merges. Clean up incrementally and
    # flip `continue-on-error` off once the baseline is green.
    name: ruff (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Sync project (dev extras)
        run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check src tests
