# port.yaml — machine-readable manifest read by omicverse.org/ports
# Spec: https://github.com/omicverse/omicverse-org-home/blob/main/docs/PORT_MANIFEST.md
schema: omicverse-port/v1
package: "py-CopyKAT"
pypi: "pycopykat"
import_name: "pycopykat"
language: python
domain: single-cell
upstream:
  name: "copykat"
  source: "GitHub"
  version: "1.2.5"
  url: "https://github.com/navinlabcode/copykat"
  license: "GPL-2"
  citation: "Gao R, Bai S, Henderson YC, et al. Delineating copy number and clonal substructure in human tumors from single-cell transcriptomes. Nat Biotechnol 39, 599-608 (2021)"
omicverse:
  module: "ov.single.CNV(method='copykat')"
  since: null
parity:
  status: pass   # R RNG + rgamma, hclust/cutree, mixtools EM ported; same seed -> R's result
  algorithm_class: stochastic-seeded
  metric: "breakpoints and per-cell calls identical; CNA max_abs_diff"
  threshold: "calls and breakpoints identical; CNA < 1e-9"
  value: "6 GSE148673 tumours (532-3,225 cells): identical breakpoints, baseline cells and calls; CNA max |diff| 1.3e-11 to 6.2e-11; known-normal, cell-line and Pearson modes identical on TNBC3"
  fixture: "copykat exp.rawdata (tests/data); GSE148673 DCIS1, TNBC1-5"
  test: "tests/test_parity.py (stored R results, tests/r_reference.R); tests/test_rcompat.py (tests/r_components.R)"
artifacts:
  audit: "NAMESPACE_PARITY.md"
  report: "report/"
  compare_notebook: null
  function_notebook: null
functions:
  - r: "copykat"
    py: "pycopykat.copykat"
    status: ported
    note: "all modes: auto baseline, known normal cells, cell line, euclidean/pearson/spearman, hg20/mm10"
  - r: "annotateGenes.hg20 / annotateGenes.mm10"
    py: "pycopykat.core.annotate"
    status: ported
  - r: "baseline.norm.cl"
    py: "pycopykat.core.baseline_norm_cl"
    status: ported
  - r: "baseline.GMM"
    py: "pycopykat.core.baseline_gmm"
    status: ported
  - r: "baseline.synthetic"
    py: "pycopykat.core.baseline_synthetic"
    status: ported
  - r: "CNA.MCMC"
    py: "pycopykat.core.cna_mcmc"
    status: ported
  - r: "convert.all.bins.hg20"
    py: "pycopykat.core.convert_bins_hg20"
    status: ported
  - r: "heatmap.3"
    py: "pycopykat.viz.heatmap.plot_cna_heatmap"
    status: partial
    note: "matplotlib heatmap, not a copy of gplots heatmap.3"
  - r: "cal_dist (test.emd)"
    py: null
    status: not-ported
  - r: null
    py: "pycopykat.copykat_by_batch"
    status: ported
    note: "AnnData per-batch driver (pycopykat only)"
